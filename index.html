<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HabitFlow Pro</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>HabitFlow</h2>

        <button id="dashboardBtn">Dashboard</button>

        <button id="trackerBtn">Habit Tracker</button>

        <button id="graphBtn">Graphs</button>

        <button id="notesBtn">Notes</button>

        <button id="settingsBtn">Settings</button>

    </aside>



    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="header">

            <h1>Habit Tracker Dashboard</h1>

            <div class="dateBox">
                <span id="currentDate"></span>
            </div>

        </header>



        <!-- Summary Cards -->

        <section class="cards">

            <div class="card">

                <h3>Total Habits</h3>

                <p id="totalHabits">0</p>

            </div>

            <div class="card">

                <h3>Today's Progress</h3>

                <p id="todayProgress">0%</p>

            </div>

            <div class="card">

                <h3>Monthly Progress</h3>

                <p id="monthlyProgress">0%</p>

            </div>

            <div class="card">

                <h3>Water Intake</h3>

                <p id="waterCount">0 L</p>

            </div>

        </section>



        <!-- Habit Section -->

        <section class="habit-section">

            <div class="top-bar">

                <h2>Your Habits</h2>

                <button id="addHabitBtn">

                    + Add Habit

                </button>

            </div>

            <div id="habitTableContainer">

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
